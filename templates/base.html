{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock title %}| VizVox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type="text/css" href="{% static 'post/css/style.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">  
  </head>
    <body>
    <nav class="navbar navbar-dark sticky-top navbar-basecolor position-relative">
      <div class="navbar-nav d-flex flex-row">
        <a class="mx-3 vizvox-logo" href="{% url 'index' %}">VizVox</a>
      </div>
      <div class="navbar-nav d-flex flex-row">
        <form method="get" action="{% url 'index' %}">
          <div class="input-group" style="width: 500px; margin-left: -300px;">
            <input
              type="text"
              name="q"
              class="form-control rounded-start-pill"
              placeholder="Search"
              value="{{ request.GET.q|default:'' }}"
            >
            <button type="submit" class="btn rounded-end-pill"
                    style="background-color: #5B4AE6; color: white;">
              <i class="bi bi-search"></i>
            </button>
          </div>
        </form>
      </div>
      <div class="navbar-nav d-flex flex-row">
        {% if request.user.is_authenticated %}
        <div class="dropdown">
          <button class="btn border-0 p-0 me-3" data-bs-toggle="dropdown">
            {% if request.user.profile.icon %}
              <img src="{{ request.user.profile.icon.url }}" class="navbar-profile">
            {% else %}
              <div class="navbar-profile"></div>
            {% endif %}
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <a class="dropdown-item" href="{% url 'accounts:profile' request.user.pk %}">プロフィール</a>
            </li>
            <li>
              <form method="post" action="{% url 'accounts:logout' %}">
                {% csrf_token %}
                <button type="submit" class="dropdown-item">
                  ログアウト
                </button>
              </form>
            </li>
          </ul>
        </div>
        {% else %}
          <a class="nav-link mx-1 text-dark rounded-pill px-3" style="background-color: #F5F5F5;" href="{% url 'accounts:signup' %}">会員登録</a>
          <a class="nav-link mx-1 me-3 rounded-pill px-3" style="background-color: #5B4AE6; color: white;" href="{% url 'accounts:login' %}">ログイン</a>
        {% endif %}
      </div>
    </nav>
    <div class="p-4">
      <h1>{% block h1 %}{% endblock %}</h1>
      {% block content %}{% endblock content %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
