<div class="p-2 min-vh-100 border-end">
  <nav class="nav flex-column gap-2">
    <a class="nav-link text-dark fs-4 {% if request.resolver_match.url_name == 'index' or request.resolver_match.url_name == 'detail-post' %}bi bi-house-door-fill{% else %}bi bi-house-door{% endif %}" href="{% url 'index' %}"></a>
    <a class="nav-link text-dark bi bi-search fs-4" href="#"></a>
    <a class="nav-link text-dark fs-4 {% if request.resolver_match.url_name == 'saved-post' %}bi bi-bookmark-fill{% else %}bi bi-bookmark{% endif %}" href="{% url 'saved-post' %}"></a>
    {% if request.user.is_authenticated %}
    <a class="nav-link text-dark fs-4 {% if request.resolver_match.url_name == 'profile' %}bi bi-people-fill{% else %}bi bi-people{% endif %}" href="{% url 'accounts:profile' request.user.pk %}"></a>
    {% else %}
    <a class="nav-link text-dark fs-4 bi bi-people" href="{% url 'accounts:login' %}"></a>
    {% endif %}    
    <a class="nav-link text-dark bi bi-plus fs-4 create-button" href="{% url 'create-post' %}"></a>
  </nav>
</div>
