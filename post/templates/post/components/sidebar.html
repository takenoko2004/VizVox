<div class="min-vh-100 border-end sidebar">
  <nav class="nav flex-column sticky-sort-tab p-2">
    <a class="nav-link text-dark d-flex align-items-center rounded ps-4
        {% if request.resolver_match.url_name == 'index' or request.resolver_match.url_name == 'detail-post' %}active-sidebar{% endif %}" href="{% url 'index' %}">
      <i class="fs-4 bi {% if request.resolver_match.url_name == 'index' or request.resolver_match.url_name == 'detail-post' %}bi-house-door-fill{% else %}bi-house-door{% endif %}"></i>
      <span class="small ms-3">ホーム</span>
    </a>
    <a class="nav-link text-dark d-flex align-items-center rounded ps-4" href="#">
      <i class="fs-4 bi bi-search"></i>
      <span class="small ms-3">検索</span>
    </a>
    <a class="nav-link text-dark d-flex align-items-center rounded ps-4
        {% if request.resolver_match.url_name == 'saved-post' %}active-sidebar{% endif %}"  href="{% url 'saved-post' %}">
      <i class="fs-4 bi {% if request.resolver_match.url_name == 'saved-post' %}bi-bookmark-fill{% else %}bi-bookmark{% endif %}"></i>
      <span class="small ms-3">保存</span>
    </a>
    {% if request.user.is_authenticated %}
    <a class="nav-link text-dark d-flex align-items-center rounded ps-4
        {% if request.resolver_match.url_name == 'profile' %}active-sidebar{% endif %}" href="{% url 'accounts:profile' request.user.pk %}">
      <i class="fs-4 bi {% if request.resolver_match.url_name == 'profile' %}bi-people-fill{% else %}bi-people{% endif %}"></i>
      <span class="small ms-3">プロフィール</span>
    </a>
    {% else %}
    <a class="nav-link text-dark fs-4 bi bi-people" href="{% url 'accounts:login' %}"></a>
    {% endif %}    
    <a class="nav-link text-dark create-button mt-5 mx-auto" href="{% url 'create-post' %}">
      <i class="fs-4 bi bi-pencil-square"></i>
      <span class="small ms-3">投稿する</span>
    </a>
  </nav>
</div>
