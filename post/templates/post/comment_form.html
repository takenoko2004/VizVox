{% extends 'base.html' %}

{% block title %}コメント投稿{% endblock %}
{% block h1 %}コメント投稿{% endblock %}
{% block content %}
  <form method="post" class="p-4 m-4 bg-light border border-success rounded form-group">
    {% csrf_token %}
    <label>{{ post.text }}</label>
    <textarea type="text" class="form-control" name="text" rows="3"></textarea>
    <input type="hidden" name="post" value="{{ post.id }}">
    <button type="submit" class="btn btn-success mt-4">コメントを投稿する</button>
  </form>
{% endblock %}
